<!DOCTYPE html>
<html lang="en">
<head>
  <title>USER LOGIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow" style="max-width: 800px; max-width: 90%;">
    <h2 style="text-align:center;">LOGIN FORM</h2>
    <form method="POST" action="/user/login">
      <div class="mb-3">
        <div class="mb-3">
          <label for="form-control1" class="form-label">Username:</label>
          <input type="text" name="username" class="form-control" id="form-control1" placeholder="enter your username" required>
        </div>
        <div class="mb-3">
          <label for="form-control2" class="form-label">Password:</label>
          <input type="password" name="password" class="form-control" id="form-control2" placeholder="enter your password" required>
        </div>
        <button type="sumbit" class="btn btn-primary w-100">LOGIN</button><br><br>
        <h5 style="text-align:center;">Are You a New User? <a href="/user/register">Register Here</a></h5>
      </div>
    </form>
    {% if error %}
    <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
