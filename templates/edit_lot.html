<!DOCTYPE html>
<html lang="en">
<head>
  <title>USER REGISTER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow" style="max-width: 500px; width: 90%;">
    <h2 class="text-center mb-4">EDIT LOT</h2>
    <form method="POST">
      <div class="mb-3">
        <div class="mb-3">
            <label class="form-label">Lot location</label>
            <input type="text" name="location_name" class="form-control" value="{{ lot.location_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control" value="{{ lot.address }}" required>
        </div>
      </div>
      <div class="mb-3">
            <label class="form-label">Total Spots</label>
            <input type="number" name="total_spots" class="form-control" value="{{ lot.total_spots }}" required>
    </div>
    <button type="submit" class="btn btn-success w-100">UPDATE LOT</button><br><br>
    <a href="/admin/dashboard" class="btn btn-danger w-100">Back To Dashboard</a>
    </form>
  </div>
</body>
</html>
