<!DOCTYPE html>
<html lang="en">
<head>
    <title>PARKING LOT</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow" style="max-width: 500px; width: 90%;"><br>
        <h2 class="text-center mb-4"> CREATE LOT</h2><br>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label"><h5>Location Name : </h5></label>
                <input type="text" name="location_name" class="form-control" placeholder="Lot Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><h5>Address : </h5></label>
                <input type="text" name="address" class="form-control" placeholder="Location Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><h5>Total Spots : </h5></label>
                <input type="number" name="total_spots" class="form-control" placeholder="10" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">ADD LOT</button> | 
                <a href="/admin/dashboard" class="btn btn-danger">Back To Dashboard</a>
            </div>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
