<!DOCTYPE html>
<html lang="en">
<head>
  <title>USER REGISTER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow" style="max-width: 800px; max-width: 90%;">
    <h2 style="text-align:center;">Create Account</h2>
    <form method="POST">
      <div class="mb-3">
        <div class="mb-3">
          <label for="form-control1" class="form-label">Username:</label>
          <input type="text" name="username" class="form-control" id="form-control1" placeholder="enter your username" required>
        </div>
        <div class="mb-3">
          <label for="form-control2" class="form-label">Fullname:</label>
          <input type="text" name="full_name" class="form-control" id="form-control2" placeholder="enter your full name" required>
        </div>
        <div class="mb-3">
          <label for="form-control3" class="form-label">Password:</label>
          <input type="password" name="password" class="form-control" id="form-control3" placeholder="enter your password" required>
        </div>
        <div class="mb-3">
          <label for="form-control4">Address:</label>
          <input type="text" name="address" class="form-control" id="form-control4" placeholder="enter your address" required>
        </div>
        <div class="mb-3">
          <label for="form-control5">Pin Code:</label>
          <input type="integer" name="pin_code" class="form-control" id="form-control5" placeholder="enter your pin code" required>
        </div>
        <button type="sumbit" class="btn btn-primary w-100">Sign Up</button><br><br>
        <h5 style="text-align:center;">Already have an Account? <a href="/user/login">Login Here</a></h5>
      </div>
    </form>
    {% if error %}
    <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
